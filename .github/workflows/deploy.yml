name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The repo carries bun.lockb and pnpm-lock.yaml alongside
      # package-lock.json. Naming npm here removes the ambiguity that
      # auto-detecting hosts would otherwise have to guess at.
      - name: Install dependencies
        run: npm ci || npm install

      # No basePath: this repo publishes to the organization Pages site,
      # which serves at the domain root. The same output works unchanged
      # behind a custom domain later.
      - name: Build static export
        run: npm run build

      # Pages runs Jekyll by default, which ignores directories starting
      # with an underscore — i.e. all of Next's _next/ assets.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
